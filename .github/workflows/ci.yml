name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # No API credentials reach CI. Tests reach only the local mock on 127.0.0.1.
      APIMANAC_TEST_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run biome format .
      - run: bun run biome lint .
      - run: bun run tsc --noEmit
      # No Deno here: the workflow sandbox tests skip and the Deno-absent
      # degradation path runs, proving every other surface is unaffected.
      - run: bun test

  sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: bun install --frozen-lockfile
      # With Deno present the sandbox, isolation, and run tests execute.
      - run: bun test tests/security/sandbox.test.ts tests/integration/workflow-run.test.ts

  starter-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile

      # The example catalog is a catalog root in its own right. Authority comes
      # from the committed snapshot, so it is graded as its own repository.
      - name: Stage the starter catalog as a catalog root
        run: |
          cp -r examples/starter "$RUNNER_TEMP/starter"
          cd "$RUNNER_TEMP/starter"
          git init --quiet --initial-branch main
          git config user.email ci@example.invalid
          git config user.name ci
          git add -A
          git commit --quiet -m 'starter catalog'

      - name: Validate and build it offline
        env:
          APIMANAC_CATALOG: ${{ runner.temp }}/starter
          XDG_CONFIG_HOME: ${{ runner.temp }}/xdg/config
          XDG_CACHE_HOME: ${{ runner.temp }}/xdg/cache
          XDG_STATE_HOME: ${{ runner.temp }}/xdg/state
          XDG_DATA_HOME: ${{ runner.temp }}/xdg/data
        run: |
          bun run src/cli.ts validate --json
          bun run src/cli.ts build --offline --json
          bun run src/cli.ts search --json 'scholarly works'
          bun run src/cli.ts auth status --json

      - name: Every starter profile ships as a candidate, so nothing is callable
        env:
          APIMANAC_CATALOG: ${{ runner.temp }}/starter
          XDG_CONFIG_HOME: ${{ runner.temp }}/xdg/config
          XDG_CACHE_HOME: ${{ runner.temp }}/xdg/cache
          XDG_STATE_HOME: ${{ runner.temp }}/xdg/state
          XDG_DATA_HOME: ${{ runner.temp }}/xdg/data
        run: |
          if bun run src/cli.ts call openalex --profile public --path /works; then
            echo 'a candidate profile executed; the review boundary is broken' >&2
            exit 1
          fi

  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun build --compile --outfile dist/apimanac src/cli.ts
      - run: ./dist/apimanac --help
