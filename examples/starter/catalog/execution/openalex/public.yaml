profile_id: public
api_id: openalex
description: The public OpenAlex API. No credential; a mailto value is courtesy, not authentication.
origins: [https://api.openalex.org]
auth:
  type: none
permissions:
  - method: GET
    path: /works/**
    decision: auto
  - method: GET
    path: /authors/**
    decision: auto
  - method: GET
    path: /sources/**
    decision: auto
  - method: GET
    path: /institutions/**
    decision: auto
  - method: GET
    path: /funders/**
    decision: auto
  - method: GET
    path: /topics/**
    decision: auto
  - method: POST
    path: /**
    decision: deny
  - method: PUT
    path: /**
    decision: deny
  - method: PATCH
    path: /**
    decision: deny
  - method: DELETE
    path: /**
    decision: deny
network_scope: public
redirects:
  max: 2
cache:
  enabled: true
  ttl_seconds: 900
response:
  allowed_headers: [x-ratelimit-remaining]
health_probe:
  method: GET
  path: /works
  query: { per-page: '1' }
  expect_status: 200
verification:
  state: candidate
