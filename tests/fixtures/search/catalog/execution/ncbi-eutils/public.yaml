profile_id: public
api_id: ncbi-eutils
origins:
  - https://eutils.ncbi.nlm.nih.gov
auth:
  type: none
permissions:
  - method: GET
    path: /entrez/eutils/**
    decision: auto
  - method: POST
    path: /**
    decision: deny
  - method: PUT
    path: /**
    decision: deny
  - method: PATCH
    path: /**
    decision: deny
  - method: DELETE
    path: /**
    decision: deny
network_scope: public
cache:
  enabled: false
verification:
  state: candidate
