profile_id: public
api_id: datacite
origins:
  - https://api.datacite.org
auth:
  type: none
permissions:
  - method: GET
    path: /dois/**
    decision: auto
  - method: GET
    path: /clients/**
    decision: auto
  - method: POST
    path: /**
    decision: deny
  - method: PUT
    path: /**
    decision: deny
  - method: PATCH
    path: /**
    decision: deny
  - method: DELETE
    path: /**
    decision: deny
network_scope: public
cache:
  enabled: false
verification:
  state: candidate
