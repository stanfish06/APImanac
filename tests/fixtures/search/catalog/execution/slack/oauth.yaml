profile_id: oauth
api_id: slack
origins:
  - https://slack.com
auth:
  type: oauth2
  credential_id: slack-oauth
  components:
    - name: access_token
permissions:
  - method: GET
    path: /api/**
    decision: auto
  - method: POST
    path: /**
    decision: deny
  - method: PUT
    path: /**
    decision: deny
  - method: PATCH
    path: /**
    decision: deny
  - method: DELETE
    path: /**
    decision: deny
network_scope: public
cache:
  enabled: false
verification:
  state: candidate
