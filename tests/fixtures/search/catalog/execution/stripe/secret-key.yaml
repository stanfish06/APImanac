profile_id: secret-key
api_id: stripe
origins:
  - https://api.stripe.com
auth:
  type: bearer
  credential_id: stripe-secret
  components:
    - name: token
  placements:
    - kind: header
      header: Authorization
      template: Bearer {token}
permissions:
  - method: GET
    path: /v1/**
    decision: auto
  - method: POST
    path: /**
    decision: deny
  - method: PUT
    path: /**
    decision: deny
  - method: PATCH
    path: /**
    decision: deny
  - method: DELETE
    path: /**
    decision: deny
network_scope: public
cache:
  enabled: false
verification:
  state: candidate
