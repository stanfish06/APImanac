[tools]
bun = "1.3.13"
deno = "2"

[tasks.install]
run = "bun install --frozen-lockfile"

[tasks.format]
run = "bun run biome format --write ."

[tasks.lint]
run = "bun run biome lint ."

[tasks.typecheck]
run = "bun run tsc --noEmit"

[tasks.test]
run = "bun test"

[tasks.build]
run = "bun run src/cli.ts build --offline"

[tasks.compile]
run = "bun build --compile --outfile dist/apimanac src/cli.ts"
